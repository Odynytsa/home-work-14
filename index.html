<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container py-3">

        <!-- HEADER -->
        <header class="box">

            <h2>HEADER</h2>

            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="menu">

                        <ul class="navbar-nav me-auto">

                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                                    Категорії
                                </a>

                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">HTML</a></li>
                                    <li><a class="dropdown-item" href="#">CSS</a></li>
                                    <li><a class="dropdown-item" href="#">Bootstrap</a></li>
                                </ul>
                            </li>

                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                                    Послуги
                                </a>

                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Верстка</a></li>
                                    <li><a class="dropdown-item" href="#">Дизайн</a></li>
                                    <li><a class="dropdown-item" href="#">SEO</a></li>
                                </ul>
                            </li>

                        </ul>

                    </div>
                </div>
            </nav>

        </header>

        <!-- CONTENT -->
        <div class="row">

            <!-- LEFT -->
            <aside class="col-12 col-md-4 col-lg-3">

                <div class="box">
                    <h3>LEFT</h3>

                    <div id="slider" class="carousel slide">

                        <div class="carousel-inner">

                            <div class="carousel-item active">
                                <img src="https://picsum.photos/300/500?1" class="d-block w-100" alt="">
                            </div>

                            <div class="carousel-item">
                                <img src="https://picsum.photos/300/500?2" class="d-block w-100" alt="">
                            </div>

                            <div class="carousel-item">
                                <img src="https://picsum.photos/300/500?3" class="d-block w-100" alt="">
                            </div>

                            <div class="carousel-item">
                                <img src="https://picsum.photos/300/500?4" class="d-block w-100" alt="">
                            </div>

                        </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#slider"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>

                        <button class="carousel-control-next" type="button" data-bs-target="#slider"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>

                    </div>
                </div>

            </aside>

            <!-- MAIN -->
            <main class="col-12 col-md-8 col-lg-6">

                <div class="box">
                    <h3>MAIN</h3>

                    <div class="accordion" id="accordionExample">

                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#one">
                                    Розділ 1
                                </button>
                            </h2>

                            <div id="one" class="accordion-collapse collapse show">
                                <div class="accordion-body">
                                    Вміст першого розділу.
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" data-bs-toggle="collapse"
                                    data-bs-target="#two">
                                    Розділ 2
                                </button>
                            </h2>

                            <div id="two" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    Вміст другого розділу.
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </main>

            <!-- RIGHT -->
            <aside class="col-12 col-lg-3">

                <div class="box">

                    <h3>RIGHT</h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Ім'я</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Прізвище</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Телефон</label>
                            <input type="tel" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Повідомлення</label>
                            <textarea class="form-control"></textarea>
                        </div>

                        <button class="btn btn-primary">
                            Надіслати
                        </button>

                        <button type="reset" class="btn btn-secondary">
                            Очистити
                        </button>

                    </form>

                </div>

            </aside>

        </div>

        <!-- FOOTER -->
        <footer class="box">
            FOOTER © 2026
        </footer>

    </div>

</body>

</html>
